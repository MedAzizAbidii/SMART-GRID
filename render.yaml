# Render Blueprint — deploys the FastAPI backend as a Docker web service.
#
# Setup on Render:
#   1. New > Blueprint > connect this repo, root directory = smartgrid_simulation/
#   2. Render reads this file and provisions the service below.
#   3. Set the secret env vars marked "sync: false" in the Render dashboard
#      (they are NOT read from this file for security — never commit real
#      secrets here).
#
# Database: this blueprint does NOT provision Postgres — point DATABASE_URL
# at your Supabase project's connection string instead (Project Settings >
# Database > Connection string > URI, "Session pooler" mode recommended for
# a server that opens many short-lived connections).

services:
  - type: web
    name: smartgrid-backend
    runtime: docker
    dockerfilePath: ./production/docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SGRID_ENVIRONMENT
        value: production
      - key: SGRID_DEBUG
        value: "false"
      - key: SGRID_API_HOST
        value: "0.0.0.0"
      - key: SGRID_API_PORT
        value: "8000"
      - key: SGRID_CORS_ALLOWED_ORIGINS
        value: '["https://smart-grid1.vercel.app"]'
      - key: SGRID_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: SGRID_JWT_SECRET_KEY
        sync: false   # set in Render dashboard — generate via:
                      # python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: SGRID_JWT_ALGORITHM
        value: HS256
      - key: SGRID_JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        sync: false   # set in Render dashboard — Supabase connection string
      - key: SGRID_BLOCKCHAIN_BLOCK_SIZE
        value: "20"
      - key: SGRID_LOG_LEVEL
        value: INFO

# nginx reverse-proxy config for the dashboard container.
# Static dashboard assets served directly; API/websocket/health/metrics
# traffic proxied to the backend service (Docker Compose service name
# "backend", resolved via Docker's internal DNS).

server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }
}

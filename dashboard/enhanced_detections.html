<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Detection - Detailed Criteria</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #04050f;
  --bg-card: #0b0e1f;
  --bg-card2: #0f1428;
  --bg-border: #1a2040;
  --accent-green: #00ff88;
  --accent-orange: #ffaa44;
  --accent-red: #ff3355;
  --accent-blue: #00ccff;
  --text-primary: #e8eaf6;
  --text-secondary: #7a8aaa;
  --text-dim: #3a4a6a;
  --glow-green: 0 0 12px rgba(0,255,136,0.5);
  --glow-red: 0 0 18px rgba(255,51,85,0.7);
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Rajdhani', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 20px;
}

.header {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #0b0e1f 0%, #0f1830 50%, #0b0e1f 100%);
  border: 1px solid var(--bg-border);
  border-top: 3px solid var(--accent-green);
  border-radius: 10px;
  margin-bottom: 30px;
}

.header h1 {
  font-family: var(--font-display);
  font-size: 2em;
  color: var(--accent-green);
  text-shadow: var(--glow-green);
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.header .subtitle {
  font-family: var(--font-mono);
  font-size: 0.9em;
  color: var(--text-secondary);
  letter-spacing: 2px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--bg-border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
}

.stat-card .label {
  font-family: var(--font-mono);
  font-size: 0.85em;
  color: var(--text-secondary);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-card .value {
  font-family: var(--font-display);
  font-size: 2em;
  font-weight: 900;
  color: var(--accent-green);
}

.detection-list {
  display: grid;
  gap: 20px;
}

.detection-card {
  background: var(--bg-card);
  border: 1px solid var(--bg-border);
  border-left: 4px solid var(--accent-red);
  border-radius: 10px;
  padding: 20px;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.detection-header {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--bg-border);
}

.detection-info {
  font-family: var(--font-mono);
  font-size: 0.9em;
}

.detection-info .key {
  color: var(--text-secondary);
  font-size: 0.85em;
  margin-bottom: 5px;
}

.detection-info .val {
  color: var(--text-primary);
  font-size: 1.1em;
  font-weight: bold;
}

.anomaly-badge {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: bold;
  background: rgba(255,51,85,0.2);
  color: var(--accent-red);
  border: 1px solid var(--accent-red);
}

.criteria-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.criteria-item {
  background: var(--bg-card2);
  border: 1px solid var(--bg-border);
  border-radius: 8px;
  padding: 15px;
}

.criteria-item .name {
  font-family: var(--font-mono);
  font-size: 0.85em;
  color: var(--text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.criteria-item .score {
  font-family: var(--font-display);
  font-size: 1.5em;
  font-weight: 700;
  margin-bottom: 8px;
}

.criteria-item .score.high {
  color: var(--accent-red);
  text-shadow: var(--glow-red);
}

.criteria-item .score.medium {
  color: var(--accent-orange);
}

.criteria-item .score.low {
  color: var(--accent-green);
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  transition: width 0.5s ease;
}

.progress-fill.high {
  background: linear-gradient(90deg, #cc2233, var(--accent-red));
}

.progress-fill.medium {
  background: linear-gradient(90deg, #cc7700, var(--accent-orange));
}

.progress-fill.low {
  background: linear-gradient(90deg, #00aa55, var(--accent-green));
}

.no-data {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
  font-size: 1.2em;
}

.loading {
  text-align: center;
  padding: 40px;
  color: var(--accent-blue);
  font-family: var(--font-mono);
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.05);
}

::-webkit-scrollbar-thumb {
  background: rgba(0,255,136,0.3);
  border-radius: 4px;
}
</style>
</head>
<body>
  <div class="header">
    <h1>🔍 ENHANCED DETECTION - DETAILED CRITERIA</h1>
    <div class="subtitle">7-CRITERIA MULTI-LAYER ANOMALY DETECTION SYSTEM</div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Anomalies</div>
      <div class="value" id="total-anomalies">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Showing</div>
      <div class="value" id="showing">0</div>
    </div>
    <div class="stat-card">
      <div class="label">Last Update</div>
      <div class="value" style="font-size: 1.2em;" id="last-update">--:--:--</div>
    </div>
  </div>

  <div id="detection-container" class="detection-list">
    <div class="loading">Loading enhanced detection data...</div>
  </div>

  <script>
    const API_BASE = '';

    function getCriteriaClass(score) {
      if (score >= 0.7) return 'high';
      if (score >= 0.3) return 'medium';
      return 'low';
    }

    function formatScore(score) {
      return (score * 100).toFixed(1) + '%';
    }

    async function fetchEnhancedDetections() {
      try {
        const response = await fetch(`${API_BASE}/api/smart-meters/enhanced-detections?limit=20`);
        if (!response.ok) throw new Error('API Error');
        
        const data = await response.json();
        displayDetections(data);
        
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
      } catch (error) {
        console.error('Error fetching detections:', error);
        document.getElementById('detection-container').innerHTML = 
          '<div class="no-data">Error loading data. Please check if the simulator is running.</div>';
      }
    }

    function displayDetections(data) {
      if (!data.detections || data.detections.length === 0) {
        document.getElementById('detection-container').innerHTML = 
          '<div class="no-data">No anomalies detected yet. Start the simulator to generate data.</div>';
        return;
      }

      document.getElementById('total-anomalies').textContent = data.total_anomalies.toLocaleString();
      document.getElementById('showing').textContent = data.returned;

      const html = data.detections.map(det => {
        const criteria = det.criteria;
        
        return `
          <div class="detection-card">
            <div class="detection-header">
              <div class="detection-info">
                <div class="key">Timestamp</div>
                <div class="val">${det.timestamp}</div>
              </div>
              <div class="detection-info">
                <div class="key">Meter ID</div>
                <div class="val">${det.meter_id}</div>
              </div>
              <div class="detection-info">
                <div class="key">Zone</div>
                <div class="val">${det.zone}</div>
              </div>
              <div class="detection-info">
                <div class="key">Type</div>
                <div class="val">${det.type}</div>
              </div>
              <div class="detection-info">
                <div class="key">Voltage</div>
                <div class="val">${det.tension_v.toFixed(2)} V</div>
              </div>
              <div class="detection-info">
                <div class="key">Consumption</div>
                <div class="val">${det.consommation_kw.toFixed(2)} kW</div>
              </div>
              <div class="detection-info">
                <div class="key">Current</div>
                <div class="val">${det.courant_a.toFixed(2)} A</div>
              </div>
              <div class="detection-info">
                <div class="key">Anomaly Type</div>
                <div class="val">
                  <span class="anomaly-badge">${det.anomaly_type.toUpperCase()}</span>
                </div>
              </div>
              <div class="detection-info">
                <div class="key">Confidence</div>
                <div class="val">${(det.confidence * 100).toFixed(1)}%</div>
              </div>
            </div>

            <div style="margin-bottom: 10px; font-family: var(--font-display); font-size: 0.9em; color: var(--text-secondary); letter-spacing: 2px;">
              DETECTION CRITERIA SCORES
            </div>

            <div class="criteria-grid">
              <div class="criteria-item">
                <div class="name">🤖 ML Reconstruction</div>
                <div class="score ${getCriteriaClass(criteria.reconstruction)}">${formatScore(criteria.reconstruction)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.reconstruction)}" style="width: ${criteria.reconstruction * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">⚡ Voltage Anomaly</div>
                <div class="score ${getCriteriaClass(criteria.voltage)}">${formatScore(criteria.voltage)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.voltage)}" style="width: ${criteria.voltage * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">📊 Consumption</div>
                <div class="score ${getCriteriaClass(criteria.consumption)}">${formatScore(criteria.consumption)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.consumption)}" style="width: ${criteria.consumption * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">⚙️ Power Factor</div>
                <div class="score ${getCriteriaClass(criteria.power_factor)}">${formatScore(criteria.power_factor)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.power_factor)}" style="width: ${criteria.power_factor * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">📡 Frequency</div>
                <div class="score ${getCriteriaClass(criteria.frequency)}">${formatScore(criteria.frequency)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.frequency)}" style="width: ${criteria.frequency * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">🕐 Temporal Pattern</div>
                <div class="score ${getCriteriaClass(criteria.temporal)}">${formatScore(criteria.temporal)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.temporal)}" style="width: ${criteria.temporal * 100}%"></div>
                </div>
              </div>

              <div class="criteria-item">
                <div class="name">📈 Rate of Change</div>
                <div class="score ${getCriteriaClass(criteria.rate_change)}">${formatScore(criteria.rate_change)}</div>
                <div class="progress-bar">
                  <div class="progress-fill ${getCriteriaClass(criteria.rate_change)}" style="width: ${criteria.rate_change * 100}%"></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('detection-container').innerHTML = html;
    }

    // Initial fetch
    fetchEnhancedDetections();

    // Auto-refresh every 5 seconds
    setInterval(fetchEnhancedDetections, 5000);
  </script>
</body>
</html>
